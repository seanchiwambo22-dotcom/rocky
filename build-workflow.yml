name: Build apps
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run fonts
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-app
          path: dist/*.exe
  android:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run fonts
      - name: Make sure Android SDK 34 is installed
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true
      - run: npx cap add android
      - name: Add Rocky icons and splash
        run: |
          cp -r android-res/mipmap-* android/app/src/main/res/
          cp android-res/values/ic_launcher_background.xml android/app/src/main/res/values/
          find android/app/src/main/res -name splash.png -exec cp android-res/splash.png {} \;
      - run: npx cap sync android
      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Android-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
